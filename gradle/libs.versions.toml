[versions]
agp = "9.4.1"
activity = "1.13.0"
fragment = "1.9.1"
#noinspection GradleDependency
kotlinReflect = "2.2.0"
preference = "1.2.1"
appcompat = "1.8.0"
navigation = "2.10.2"
transition = "1.7.2"
splashScreen = "1.2.0"
material = "1.14.0"
#noinspection NewerVersionAvailable
aboutLibraries = "14.2.1"
markdown = "4.6.2"
shizuku = "13.1.5"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlinReflect"}
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-navigation = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
androidx-transition = { module = "androidx.transition:transition", version.ref = "transition" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashScreen" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
aboutlibraries-view = { module = "com.mikepenz:aboutlibraries", version.ref = "aboutLibraries" }
markdown-core = { module = "io.noties.markwon:core", version.ref = "markdown" }
markdown-linkify = { module = "io.noties.markwon:linkify", version.ref = "markdown" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
aboutLibraries = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutLibraries" }